name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: anomaly51-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.api-api-api.com
          username: admin
          password: admin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: harbor.api-api-api.com/shisha/backend:main-${{ github.run_number }}-${{ github.sha }}
