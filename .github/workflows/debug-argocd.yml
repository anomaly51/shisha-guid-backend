name: Debug ArgoCD

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARGOCD_APPLICATION: shisha-guid
  ARGOCD_CLI_VERSION: v3.4.3

jobs:
  app-status:
    runs-on: arc-runner-set
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          case "$(uname -m)" in
            x86_64|amd64)
              argocd_asset=argocd-linux-amd64
              jq_asset=jq-linux-amd64
              ;;
            aarch64|arm64)
              argocd_asset=argocd-linux-arm64
              jq_asset=jq-linux-arm64
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac
          curl -fsSL \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/${argocd_asset}" \
            -o "${RUNNER_TEMP}/bin/argocd"
          curl -fsSL \
            "https://github.com/jqlang/jq/releases/download/jq-1.8.1/${jq_asset}" \
            -o "${RUNNER_TEMP}/bin/jq"
          chmod +x "${RUNNER_TEMP}/bin/argocd" "${RUNNER_TEMP}/bin/jq"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Print app status
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          ARGOCD_INSECURE: ${{ secrets.ARGOCD_INSECURE }}
        shell: bash
        run: |
          set -euo pipefail
          argocd_common=(--grpc-web)
          if [ "${ARGOCD_INSECURE:-true}" != "false" ]; then
            argocd_common+=(--insecure)
          fi
          argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USERNAME" --password "$ARGOCD_PASSWORD" "${argocd_common[@]}"
          app_json="$(argocd app get "$ARGOCD_APPLICATION" --refresh -o json --server "$ARGOCD_SERVER" "${argocd_common[@]}")"
          jq '{
            sync: .status.sync.status,
            health: .status.health.status,
            revision: .status.sync.revision,
            images: .status.summary.images,
            conditions: .status.conditions,
            operationState: .status.operationState.phase
          }' <<< "$app_json"
